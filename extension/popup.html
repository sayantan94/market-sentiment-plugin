<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #e7e9ea;
      margin: 0;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #1d9bf0;
    }
    .stat {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2f3336;
      font-size: 14px;
    }
    .stat-value {
      font-weight: 700;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.ok { background: #00ba7c; }
    .status-dot.err { background: #f4212e; }
    .btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      border: none;
      border-radius: 20px;
      background: #f4212e;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <h2>$ Market Sentiment</h2>
  <div class="stat">
    <span><span class="status-dot" id="health-dot"></span>Backend</span>
    <span class="stat-value" id="health-text">...</span>
  </div>
  <div class="stat">
    <span>Saved Posts</span>
    <span class="stat-value" id="count">—</span>
  </div>
  <button class="btn" id="clear-btn">Clear All</button>
  <script src="popup.js"></script>
</body>
</html>
